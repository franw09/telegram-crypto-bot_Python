[pytest]
# Конфигурация pytest для CryptoBot

# Минимальная версия pytest
minversion = 7.0

# Папки для поиска тестов
testpaths = tests

# Паттерн для поиска тестовых файлов
python_files = test_*.py

# Паттерн для поиска тестовых классов
python_classes = Test*

# Паттерн для поиска тестовых функций
python_functions = test_*

# Опции запуска по умолчанию
addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto

# Маркеры для категоризации тестов
markers =
    asyncio: тесты с асинхронными функциями
    slow: медленные тесты (исключать при быстрой проверке)
    integration: интеграционные тесты с внешними API
    unit: юнит-тесты

# Игнорировать предупреждения
filterwarnings =
    ignore::DeprecationWarning
